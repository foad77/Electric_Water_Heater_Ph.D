<VirtualHost *:80>
    ServerName www.energytradings.online
    ServerAlias 15.204.199.229 www.energytradings.online energytradings.online http://energytradings.online http://www.energytradings.online
    ServerAdmin foad.najafi77@gmail.com
    WSGIDaemonProcess ewh_app python-path=/home/Web/EWH_WEB_APP
    WSGIProcessGroup ewh_app
    WSGIScriptAlias / /home/Web/EWH_WEB_APP/ewh_app.wsgi

    <Directory /home/Web/EWH_WEB_APP>
        Require all granted
    </Directory>

    Alias /static /home/Web/EWH_WEB_APP/static
    <Directory /home/Web/EWH_WEB_APP/static/>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ewh_app_error.log
    CustomLog ${APACHE_LOG_DIR}/ewh_app_access.log combined
</VirtualHost>

# This file is supposed to be kept in the Apache configue directory.
# in modern Ubuntu or Debian systems, it would be in "/etc/apache2/sites-available/"
